version: '3.7'
x-environment: &environment
  CLICKHOUSE_USER: default
  CLICKHOUSE_PASSWORD: ""
  CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1

x-clickhouse: &clickhouse
  image: clickhouse/clickhouse-server:26.7
  environment:
    <<: *environment
  depends_on:
    - energosbyt_keeper1
    - energosbyt_keeper2
    - energosbyt_keeper3

services:
  energosbyt_keeper1:
    image: clickhouse/clickhouse-keeper:26.7
    container_name: energosbyt_keeper1
    volumes:
      - ./configs/keeper/1.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
      - ./volume/energosbyt_keeper1:/var/lib/clickhouse-keeper
    ports:
      - "9181:9181"

  energosbyt_keeper2:
    image: clickhouse/clickhouse-keeper:26.7
    container_name: energosbyt_keeper2
    volumes:
      - ./configs/keeper/2.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
      - ./volume/energosbyt_keeper2:/var/lib/clickhouse-keeper
    ports:
      - "9182:9181"

  energosbyt_keeper3:
    image: clickhouse/clickhouse-keeper:26.7
    container_name: energosbyt_keeper3
    volumes:
      - ./configs/keeper/3.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
      - ./volume/energosbyt_keeper3:/var/lib/clickhouse-keeper
    ports:
      - "9183:9181"

  energosbyt_ch1:
    <<: *clickhouse
    container_name: energosbyt_ch1
    hostname: energosbyt_ch1
    ports:
      - "8123:8123" # Веб-интерфейс
      - "9000:9000"
      - "9363:9363" # Метрики
    volumes:
      - ./configs/clickhouse/remote-servers.xml:/etc/clickhouse-server/config.d/remote-servers.xml:ro
      - ./configs/clickhouse/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro
      - ./configs/clickhouse/macros/1.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ./volume/energosbyt_ch1:/var/lib/clickhouse

  energosbyt_ch2:
    <<: *clickhouse
    container_name: energosbyt_ch2
    hostname: energosbyt_ch2
    ports:
      - "8124:8123" # Веб-интерфейс
    volumes:
      - ./configs/clickhouse/remote-servers.xml:/etc/clickhouse-server/config.d/remote-servers.xml:ro
      - ./configs/clickhouse/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro
      - ./configs/clickhouse/macros/2.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ./volume/energosbyt_ch2:/var/lib/clickhouse

  energosbyt_ch3:
    <<: *clickhouse
    container_name: energosbyt_ch3
    hostname: energosbyt_ch3
    ports:
      - "8125:8123"
    volumes:
      - ./configs/clickhouse/remote-servers.xml:/etc/clickhouse-server/config.d/remote-servers.xml:ro
      - ./configs/clickhouse/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro
      - ./configs/clickhouse/macros/3.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ./volume/energosbyt_ch3:/var/lib/clickhouse

  energosbyt_ch4:
    <<: *clickhouse
    container_name: energosbyt_ch4
    hostname: energosbyt_ch4
    ports:
      - "8126:8123"
    volumes:
      - ./configs/clickhouse/remote-servers.xml:/etc/clickhouse-server/config.d/remote-servers.xml:ro
      - ./configs/clickhouse/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro
      - ./configs/clickhouse/macros/4.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ./volume/energosbyt_ch4:/var/lib/clickhouse

  energosbyt_ch5:
    <<: *clickhouse
    container_name: energosbyt_ch5
    hostname: energosbyt_ch5
    ports:
      - "8127:8123"
    volumes:
      - ./configs/clickhouse/remote-servers.xml:/etc/clickhouse-server/config.d/remote-servers.xml:ro
      - ./configs/clickhouse/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro
      - ./configs/clickhouse/macros/5.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ./volume/energosbyt_ch5:/var/lib/clickhouse

  energosbyt_ch6:
    <<: *clickhouse
    container_name: energosbyt_ch6
    hostname: energosbyt_ch6
    ports:
      - "8128:8123"
    volumes:
      - ./configs/clickhouse/remote-servers.xml:/etc/clickhouse-server/config.d/remote-servers.xml:ro
      - ./configs/clickhouse/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro
      - ./configs/clickhouse/macros/6.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ./volume/energosbyt_ch6:/var/lib/clickhouse

  # Сбор метрик
  prometheus:
    image: prom/prometheus:latest
    container_name: energosbyt_prometheus
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./volume/prometheus:/prometheus
    ports:
      - "9090:9090"

  # Дашборды с метриками ClickHouse
  grafana:
    image: grafana/grafana:latest
    container_name: energosbyt_grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin # admin/admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Логи также пишутся на диск
      GF_PATHS_DATA: /var/lib/grafana
      GF_PATHS_LOGS: /var/log/grafana
      # Включаем дублирование логов из консоли в файл
      GF_LOG_MODE: console file
    volumes:
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./configs/grafana/dashboards/energosbyt.json:/var/lib/grafana/dashboards/energosbyt.json:ro
      - ./volume/grafana:/var/lib/grafana
      - ./volume/grafana/logs:/var/log/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  energosbyt_kafka:
    image: confluentinc/cp-kafka:7.6.1 
    container_name: energosbyt_kafka             
    ports:
      - "9092:9092"  # Публичный порт для клиентов
      - "9093:9093"  # Порт для управления кластером
    networks:
      default:
        aliases:
          - kafka
    environment:
      # Уникальный ID ноды в кластере (в KRaft это обязательно)
      KAFKA_NODE_ID: 1
      # Роли: брокер (обработка сообщений) + контроллер (управление метаданными)
      KAFKA_PROCESS_ROLES: broker,controller
      # Слушатели: клиенты на 9092, контроллер на 9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # Адрес для клиентов (внутри docker-сети)
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      # Имя слушателя для controller protocol
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Протоколы безопасности (здесь без шифрования)
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      # Список голосующих контроллеров (для консенсуса в KRaft)
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Фактор репликации для внутреннего топика офсетов (1 = без репликации)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Минимальное количество синхронных реплик для транзакций
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Задержка перебалансировки consumer-групп (0 = без задержки)
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Автосоздание топиков при первом обращении            
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Количество партиций по умолчанию для новых топиков
      KAFKA_NUM_PARTITIONS: 3
      # Уникальный ID кластера (требуется для KRaft, рандомный)
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
    volumes:
      - ./volume/energosbyt_kafka:/var/lib/kafka
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Веб-интерфейс для управления Kafka (топики, сообщения, consumer-группы)
  energosbyt_kafka_ui:
    image: provectuslabs/kafka-ui:latest
    container_name: energosbyt_kafka_ui
    depends_on:
      - energosbyt_kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      # Сервер Kafka, к которому подключается UI
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: energosbyt_kafka:9092

  # Экспортер метрик Kafka для Prometheus.
  # Собирает метрики брокера: consumer lag, throughput, количество топиков/партиций.
  # Отдаёт метрики на порту 9308 в формате Prometheus.
  # restart обязателен: если контейнеры только поднялись, Kafka ещё не слушает 9092,
  # экспортер завершается с ошибкой и без restart остаётся мёртвым до ручного перезапуска.
  energosbyt_kafka_exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: energosbyt_kafka_exporter
    depends_on:
      - energosbyt_kafka
    restart: unless-stopped
    command:
      # Адрес Kafka-брокера внутри Docker-сети
      - --kafka.server=energosbyt_kafka:9092
      # Порт, на котором экспортер отдаёт метрики
      - --web.listen-address=:9308
    ports:
      - "9308:9308"

  # Продюсер счётчиков показаний электричества в виде сообщений в Kafka (для воркшопа)
  energosbyt_streamer:
    build: ./app/energosbyt
    container_name: energosbyt_streamer
    depends_on:
      - energosbyt_kafka
      - energosbyt_ch1
      - energosbyt_ch2
      - energosbyt_ch3
      - energosbyt_ch4
      - energosbyt_ch5
      - energosbyt_ch6
      - energosbyt_keeper1
      - energosbyt_keeper2
      - energosbyt_keeper3
    profiles:
      - manual