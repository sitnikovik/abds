version: '3.7'

services:
  ch1:
    image: clickhouse/clickhouse-server:26.7
    container_name: ch1
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - .volume/ch1/:/var/lib/clickhouse
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=supadupapwd

volumes:
  ch1:
    driver: local