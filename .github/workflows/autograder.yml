name: Autograder

on:
  pull_request:
    paths:
      - 'autograder/**'
      - '.github/ci.env'
      - 'make/**'
      - '.github/workflows/autograder.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: autograder/go.mod
          cache-dependency-path: autograder/go.sum
      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh \
            | sh -s -- -b $(go env GOPATH)/bin v2.8.0
          echo "PATH=$(go env GOPATH)/bin:$PATH" >> $GITHUB_ENV
      - name: Run autograder checks
        run: |
          make -C autograder check
