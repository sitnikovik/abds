name: Energosbyt Lab 1 Check (Reusable)

on:
  workflow_call:

jobs:
  lab:
    name: Lab 1
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout student repository
        uses: actions/checkout@v4

      - name: Checkout course repository
        uses: actions/checkout@v4
        with:
          repository: sitnikovik/abds
          path: course

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: course/autograder/go.mod
          cache-dependency-path: course/autograder/go.sum

      - name: Check required files
        run: |
          for f in docker-compose.yml Makefile .env.local; do
            if [ ! -f "$f" ]; then
              echo "::error::file $f is missing in the repository"
              exit 1
            fi
          done

      - name: Start services
        run: make run

      - name: Prepare data
        timeout-minutes: 5
        run: make setup

      - name: Run autograder
        run: |
          set -a
          . ./.env.local
          set +a
          for i in $(seq 1 30); do
            if curl -fs "http://localhost:${APP_PORT}/ping" > /dev/null; then
              break
            fi
            sleep 2
          done
          cd course/autograder
          go run ./cmd/lab1

      - name: Show service logs
        if: always()
        run: docker compose logs

      - name: Stop services
        if: always()
        run: docker compose down -v
